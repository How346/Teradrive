name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed only to create the GitHub Release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore TeraDrive.sln
      - run: dotnet build TeraDrive.sln -c Release --no-restore
      - run: dotnet test TeraDrive.sln -c Release --no-build

      - name: Publish
        run: >
          dotnet publish src/TeraDrive.App/TeraDrive.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -PublishDir publish/app -Output artifacts/TeraDrive-win-x64-portable.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" artifacts/TeraDrive-win-x64-portable.zip --title "TeraDrive $env:GITHUB_REF_NAME" --generate-notes
